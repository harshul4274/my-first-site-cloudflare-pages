<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Adit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2230;
    --ink-soft: #3a4257;
    --orange: #f26a21;
    --orange-deep: #d4560f;
    --sheet: #ffffff;
    --bg: #e9edf3;
    --line: #d5dbe6;
    --muted: #5d667b;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f;
      --sheet: #1c2230;
      --line: #313a4f;
      --ink: #f2f4f8;
      --ink-soft: #c5cbda;
      --muted: #97a0b5;
    }
    .brand { background: #0b0e15; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--bg);
    display: grid;
    grid-template-columns: minmax(280px, 34%) 1fr;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Brand panel */
  .brand {
    background: #1c2230;
    color: #fff;
    padding: clamp(24px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .brand::after {
    content: "";
    position: absolute;
    right: -90px; bottom: -90px;
    width: 280px; height: 280px;
    border: 44px solid var(--orange);
    border-radius: 50%;
    opacity: .9;
  }
  .logo { display: inline-flex; align-items: center; min-height: 44px; }
  .logo img { height: 56px; width: auto; max-width: 100%; display: block; }
  .logo .fallback { display: none; font: 800 1.3rem var(--display); }
  .brand p {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #c9cfdd;
    max-width: 26ch;
    position: relative;
    z-index: 1;
  }

  /* Main */
  main {
    display: grid;
    place-items: center;
    padding: clamp(20px, 5vw, 64px);
  }
  .wrap { width: 100%; max-width: 620px; }

  .sheet {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-top: 6px solid var(--orange);
    border-radius: 6px;
    padding: clamp(22px, 4vw, 40px);
    position: relative;
    box-shadow: 0 1px 0 var(--line), 0 24px 48px -28px rgba(20, 28, 48, .35);
  }
  .code {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(5.5rem, 22vw, 10rem);
    line-height: .85;
    letter-spacing: -.04em;
    color: var(--ink);
  }
  .code i { font-style: normal; display: inline-block; animation: drop .7s cubic-bezier(.3, 1.5, .5, 1) both; }
  .code i:nth-child(1) { animation-delay: .05s; }
  .code i:nth-child(2) { animation-delay: .2s, 1.1s; animation-name: drop, spin-wobble; animation-duration: .7s, 4s; animation-iteration-count: 1, infinite; animation-timing-function: cubic-bezier(.3, 1.5, .5, 1), ease-in-out; color: var(--orange); }
  .code i:nth-child(3) { animation-delay: .35s; }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-70px) rotate(-8deg); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes spin-wobble {
    0%, 100% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-8deg) scale(1.04); }
    50% { transform: rotate(0) scale(1); }
    75% { transform: rotate(8deg) scale(1.04); }
  }

  .stamp {
    position: absolute;
    top: clamp(18px, 4vw, 34px);
    right: clamp(14px, 3vw, 30px);
    transform: rotate(-9deg);
    border: 3px solid var(--orange);
    color: var(--orange);
    font: 800 clamp(.8rem, 2.6vw, 1.1rem) var(--display);
    letter-spacing: .08em;
    padding: 6px 12px;
    border-radius: 4px;
    animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) .9s both, stamp-pulse 2.8s ease-in-out 1.6s infinite;
  }
  @keyframes stamp {
    0%   { opacity: 0; transform: rotate(-9deg) scale(2.4); }
    60%  { opacity: 1; transform: rotate(-9deg) scale(.92); }
    100% { opacity: 1; transform: rotate(-9deg) scale(1); }
  }
  @keyframes stamp-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242, 106, 33, 0); }
    50% { box-shadow: 0 0 0 8px rgba(242, 106, 33, .18); }
  }
  .sheet { animation: thud .35s ease-out 1.1s both; }
  @keyframes thud {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -1px); }
    75% { transform: translate(-2px, 1px); }
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.5rem, 4.5vw, 2.1rem);
    letter-spacing: -.02em;
    margin: 22px 0 10px;
  }
  .lead { color: var(--ink-soft); line-height: 1.6; max-width: 46ch; }
  .help { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }

  .fields { margin: 26px 0 30px; border-top: 1px solid var(--line); }
  .row {
    display: flex;
    gap: 16px;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: .95rem;
  }
  .row dt { color: var(--muted); flex: none; }
  .row dd { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    font: 600 1rem var(--body);
    text-decoration: none;
    padding: 13px 22px;
    border-radius: 6px;
    border: 2px solid var(--orange);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    text-align: center;
  }
  .btn.primary { background: var(--orange); color: #fff; }
  .btn.primary:hover { background: var(--orange-deep); border-color: var(--orange-deep); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--orange); color: var(--orange); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .help { margin-top: 22px; font-size: .9rem; color: var(--muted); }
  .help a { color: var(--orange-deep); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .help a { color: var(--orange); } }

  /* Mobile */
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .brand { flex-direction: row; align-items: center; gap: 16px; padding: 16px 20px; }
    .brand p { display: none; }
    .brand::after { width: 120px; height: 120px; border-width: 22px; right: -40px; bottom: -60px; }
    .logo img { height: 40px; }
    .btn { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp, .sheet, .code i { animation: none !important; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <aside class="brand">
    <a class="logo" href="/" aria-label="Adit home">
      <img src="https://adit.com/storage/settings/logo.png"
           alt="Adit" width="220" height="56" referrerpolicy="no-referrer">
      
    </a>
    <p>Dental Software for your Patient Engagement & AI Tools.</p>
  </aside>

  <main>
    <div class="wrap">
      <section class="sheet" aria-labelledby="title">
        <div class="stamp" aria-hidden="true">NOT FOUND</div>
        <div class="code" aria-hidden="true"><i>4</i><i class="o">0</i><i>4</i></div>
        <h1 id="title">We can't find that page</h1>
        <p class="lead">The link may be old, or the address may have a typo. Your client data is safe and nothing was changed.</p>

        <p class="help">If you think this is a mistake, please contact support.</p>
      </section>
    </div>
  </main>
</body>
</html>
